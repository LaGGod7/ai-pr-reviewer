services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: review
      POSTGRES_USER: gd
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gd -d review"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    env_file: ./ai-service/.env

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/review
      DB_USERNAME: gd
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  pgdata: